name: Bug report
description: Report a reproducible bug in the telecom call intelligence pipeline.
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please keep the report focused and include the minimum details needed to reproduce the issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug.
      placeholder: The pipeline crashes when... 
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the exact steps to reproduce.
      placeholder: |
        1. Run `make run`
        2. Set `...`
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, optional API provider details, branch, etc.
      placeholder: |
        - Python: 3.11
        - OS: Ubuntu 22.04
        - Branch: main
        - Provider: Claude / Gemini / NVIDIA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      description: Paste the relevant stack trace or output.
      render: text
